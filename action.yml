name: Slopstash check
description: Fail when AI comments were committed with their text, or when a marker and its stored body have come apart.
author: Pawls
branding:
  icon: check-square
  color: gray-dark
inputs:
  version:
    description: npm version or range of the slopstash CLI to run.
    default: "0.1"
  args:
    description: Extra arguments for `slopstash check`, such as `--stale` or file paths.
    default: ""
  node-version:
    description: Node.js version to run the CLI with (22 or later).
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    # check reads the index, which actions/checkout fills; no `slopstash init` is needed.
    - shell: bash
      run: npx --yes "slopstash@${SLOPSTASH_VERSION}" check ${SLOPSTASH_ARGS}
      env:
        SLOPSTASH_VERSION: ${{ inputs.version }}
        SLOPSTASH_ARGS: ${{ inputs.args }}
