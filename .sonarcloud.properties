sonar.sources=.
sonar.tests=.
sonar.test.inclusions=packages/*/test/**,packages/*/e2e/**,packages/vscode/native/**
sonar.exclusions=packages/*/test/**,packages/*/e2e/**,packages/vscode/native/**,scripts/**,spikes/**,docs/**

# SonarCloud's automatic analysis ignores the criteria below; the live copy is the
# project's Analysis Scope > Ignore Issues on Multiple Criteria setting (set 2026-10-05).
# Change both together.
#
# Findings that are this tool's job, not defects:
# - S4036: the CLI runs `git` from PATH, as every git filter and hook does.
# - S4790: the sha1 only names a per-file record under .git; nothing is authenticated by it.
# - S9382: `await` in a loop is sequential on purpose; git calls and tree-sitter parses run one at a time.
# - S5843: the scan detectors and protected-comment classes are word lists; their regexes
#   are wide alternations, which splitting into more patterns would not make clearer.
sonar.issue.ignore.multicriteria=gitpath,filename,awaitloop,detectors,protected
sonar.issue.ignore.multicriteria.gitpath.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.gitpath.resourceKey=packages/cli/src/**
sonar.issue.ignore.multicriteria.filename.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.filename.resourceKey=packages/cli/src/files.ts
sonar.issue.ignore.multicriteria.awaitloop.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.awaitloop.resourceKey=packages/**
sonar.issue.ignore.multicriteria.detectors.ruleKey=typescript:S5843
sonar.issue.ignore.multicriteria.detectors.resourceKey=packages/core/src/detectors.ts
sonar.issue.ignore.multicriteria.protected.ruleKey=typescript:S5843
sonar.issue.ignore.multicriteria.protected.resourceKey=packages/core/src/scan.ts
